name: Build installable Contact archive

on:
  workflow_dispatch:
  push:
    branches:
      - contact-2.1.0
    paths-ignore:
      - 'dist/**'

permissions:
  contents: write

concurrency:
  group: contact-build-dist
  cancel-in-progress: true

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: contact-2.1.0
          fetch-depth: 0

      - name: Read plugin version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n "s/.*'pi_version' => '\([^']*\)'.*/\1/p" autoinstall.php | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "Unable to read pi_version from autoinstall.php" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Contact $VERSION"

      - name: Build Geeklog installable archive
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'
          BUILD_DIR="$RUNNER_TEMP/contact-package"

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR/contact" dist

          cp -a admin "$BUILD_DIR/contact/"
          cp -a language "$BUILD_DIR/contact/"
          cp -a public_html "$BUILD_DIR/contact/"
          cp -a templates "$BUILD_DIR/contact/"

          cp autoinstall.php "$BUILD_DIR/contact/"
          cp functions.inc "$BUILD_DIR/contact/"
          cp install_defaults.php "$BUILD_DIR/contact/"
          cp plugin.json "$BUILD_DIR/contact/"
          cp README.md "$BUILD_DIR/contact/"
          cp ROADMAP.md "$BUILD_DIR/contact/"
          cp RELEASE-NOTES.md "$BUILD_DIR/contact/"
          cp CHANGELOG.md "$BUILD_DIR/contact/"

          rm -f "dist/contact-${VERSION}.zip"
          (
            cd "$BUILD_DIR"
            zip -r -9 "$GITHUB_WORKSPACE/dist/contact-${VERSION}.zip" contact
          )

          echo "Archive contents:"
          unzip -l "dist/contact-${VERSION}.zip"

          unzip -Z1 "dist/contact-${VERSION}.zip" | grep -q '^contact/'

          if unzip -Z1 "dist/contact-${VERSION}.zip" | grep -Eq '(^|/)\.'; then
            echo "Archive contains a dot-prefixed path, which is not allowed." >&2
            exit 1
          fi

      - name: Publish archive as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: contact-${{ steps.version.outputs.version }}
          path: dist/contact-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Commit archive to dist
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ steps.version.outputs.version }}'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add "dist/contact-${VERSION}.zip"

          if git diff --cached --quiet; then
            echo "dist/contact-${VERSION}.zip is already up to date."
            exit 0
          fi

          git commit -m "Build installable Contact ${VERSION} archive"
          git pull --rebase origin contact-2.1.0
          git push origin HEAD:contact-2.1.0
